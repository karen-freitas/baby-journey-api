info:
  title: Baby Journey API
  description: API documentation for Baby Journey project
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SaveRecordDTO:
      type: object
      properties:
        userId:
          type: string
          example: userId123
          description: ID do usuário
        title:
          type: string
          example: Primeiro Passo
          description: Título do registro
        description:
          type: string
          example: Primeiro passo do bebê
          description: Descrição do registro
        date:
          type: string
          example: 01/01/2025
          description: Data do registro no formato DD/MM/YYYY
        image:
          type: string
          example: imagem.jpg
          description: Nome do arquivo da imagem (opcional)
      required:
        - userId
        - title
        - description
        - date
    LoginDTO:
      type: object
      properties:
        email:
          type: string
          example: usuario@email.com
          description: E-mail do usuário
        password:
          type: string
          example: senha123
          description: Senha do usuário
      required:
        - email
        - password
    CreateUserDto:
      type: object
      properties:
        name:
          type: string
          example: Maria Silva
          description: Nome do usuário
        email:
          type: string
          example: maria@email.com
          description: E-mail do usuário
        password:
          type: string
          example: senha123
          description: Senha do usuário (mínimo 6 caracteres)
      required:
        - name
        - email
        - password
